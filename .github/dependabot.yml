version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/Yastık6.Api"
      - "/Yastık6.Api.Tests"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
