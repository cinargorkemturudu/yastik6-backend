name: Deploy

# Runs after CI succeeds on main. Disabled until the repository variable DEPLOY_ENABLED is set to 'true'
# and the secrets DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY exist.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - name: Pull, rebuild and restart on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd ~/Isolated-Backend-Yastik6
            git pull
            sudo docker compose down
            sudo docker compose up -d --build
          '
