version: '3.8'

services:
  yastik6-api:
    container_name: yastik6_backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Europe/Istanbul
    volumes:
      - ./server_data:/app/data

  seq:
    image: datalust/seq:latest
    container_name: yastik6_seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - ./seq_data:/data
