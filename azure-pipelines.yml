trigger:
- main

pool:
  name: 'yastik6'

steps:
- task: SSH@0
  displayName: 'Sunucuda Kodu Güncelle ve Yeniden Başlat'
  inputs:
    sshEndpoint: 'Oracle-Server-Service-Connection'
    runOptions: 'inline'
    inline: |
      set -e
      cd ~/Isolated-Backend-Yastik6
      git pull 2>&1
      sudo docker compose down 2>&1
      sudo docker compose up -d --build 2>&1
