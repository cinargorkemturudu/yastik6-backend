trigger:
- main

pool:
  name: 'yastik6'

steps:
- task: UseDotNet@2
  displayName: '.NET SDK Kurulumu'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- script: dotnet restore
  displayName: 'Bağımlılıkları Yükle (Restore)'

- script: dotnet build --configuration Release --no-restore
  displayName: 'Projeyi Derle (Build)'

- script: dotnet publish --configuration Release --no-build --output $(Build.ArtifactStagingDirectory)
  displayName: 'Projeyi Yayın Klasörüne Çıkar (Publish)'

- task: PublishBuildArtifacts@1
  displayName: 'Yayın Klasörünü Eser Olarak Kaydet (Artifact)'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
